<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>静室 · 极简时钟 — Three's 小窝</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9.5' fill='%23FDFAF5' stroke='%23EF9CB0' stroke-width='1.6'/%3E%3Cpath d='M12 7.5V12l3 1.8' stroke='%23EF9CB0' stroke-width='1.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="preconnect" href="https://miaoda.feishu.cn/fonts" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ===== SECTION: base 基础与设计令牌 ===== */
:root{
  color-scheme:light;
  --bg:#FDFAF5;
  --ink:#4B3B3A;
  --dim:rgba(75,59,58,.55);
  --faint:rgba(75,59,58,.07);
  --panel:rgba(255,252,247,.95);
  --line:rgba(75,59,58,.13);
  --pink:#EF9CB0;
  --pink-deep:#E0789A;
  --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* ===== SECTION: stage 舞台（默认只有时间） ===== */
#stage{position:fixed;inset:0;z-index:1}
#bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
#bgShade{
  position:absolute;inset:0;opacity:0;transition:opacity .4s ease;
  background:linear-gradient(180deg,rgba(253,248,241,.62),rgba(253,248,241,.34) 40%,rgba(253,248,241,.86));
}
body.hasBg #bgShade{opacity:1}
#stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(760px 520px at 12% -8%,rgba(239,156,176,.09),transparent 68%),
    radial-gradient(620px 460px at 92% 108%,rgba(127,168,217,.07),transparent 68%);
}
#clockWrap{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .36s cubic-bezier(.22,1,.36,1),opacity .3s ease;
}
body.panel-open #clockWrap{transform:translateY(-54px) scale(.84);opacity:.92}
#modeTag{
  height:22px;margin-bottom:22px;
  font-size:12px;letter-spacing:.32em;text-indent:.32em;color:var(--dim);
}
#modeTag.accent{color:var(--pink)}
#clock{
  display:flex;align-items:baseline;
  line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 22px rgba(255,255,255,.6);
  animation:appear 1s cubic-bezier(.22,1,.36,1) .1s both;
}
#clock .hm{
  font-family:var(--serif);font-weight:700;letter-spacing:.01em;
  font-size:clamp(88px,23vw,290px);
}
#clock .ss{
  font-size:clamp(28px,6.6vw,82px);font-weight:400;color:var(--dim);
  margin-left:.14em;letter-spacing:.04em;
}
#clock.cd{font-family:var(--serif);font-weight:700;font-size:clamp(68px,17vw,210px)}
@keyframes appear{from{opacity:0;transform:translateY(12px)}}

/* ===== SECTION: backHome 回到小窝 ===== */
#backHome{
  position:fixed;left:20px;top:18px;z-index:18;
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  font-size:12.5px;color:var(--dim);text-decoration:none;
  border:1px solid transparent;transition:color .2s ease,border-color .2s ease,background .2s ease;
}
#backHome:hover{color:var(--pink-deep);border-color:rgba(239,156,176,.55);background:rgba(255,255,255,.55)}
#backHome svg{width:14px;height:14px}

/* ===== SECTION: dock 底部控制条 ===== */
#dock{
  position:fixed;left:50%;bottom:28px;z-index:20;
  transform:translateX(-50%) translateY(14px);
  display:flex;gap:2px;padding:6px;
  background:var(--panel);border:1px solid rgba(75,59,58,.16);border-radius:999px;
  box-shadow:0 10px 26px rgba(75,59,58,.10);
  opacity:0;pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.22,1,.36,1);
}
#dock.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.dockBtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-width:66px;min-height:58px;padding:6px 12px;border-radius:999px;
  color:var(--dim);transition:color .2s ease,background .2s ease;
}
.dockBtn:hover,.dockBtn:active{color:var(--ink);background:var(--faint)}
.dockBtn.on{color:var(--pink)}
.dockBtn svg{width:20px;height:20px}
.dockBtn .lbl{font-size:11px;letter-spacing:.08em}

/* ===== SECTION: panel 功能面板 ===== */
#panel{
  position:fixed;left:50%;bottom:112px;z-index:19;
  transform:translateX(-50%) translateY(10px);
  min-width:252px;max-width:min(90vw,324px);padding:20px;
  background:var(--panel);border:1px solid rgba(75,59,58,.18);border-radius:18px;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease,transform .28s cubic-bezier(.22,1,.36,1);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 14px 34px rgba(75,59,58,.10);
}
#panel.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;padding:0 20px;border-radius:12px;
  border:1px solid var(--line);font-size:14px;color:var(--ink);
  transition:background .2s ease,border-color .2s ease,color .2s ease;
}
.btn:hover{background:var(--faint)}
.btn.primary{background:var(--pink);color:#4B3B3A;font-weight:700;border-color:transparent}
.btn.primary:hover{background:var(--pink-deep);color:#FFF8F2}
.btn.block{width:100%;margin-top:16px}

/* 图片 */
.imgWrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.drop{
  width:100%;height:132px;border-radius:16px;
  border:1.5px dashed rgba(75,59,58,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--dim);cursor:pointer;background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:border-color .2s ease,color .2s ease,background-color .2s ease;
}
.drop:hover{border-color:rgba(75,59,58,.42)}
.drop.over{border-color:var(--pink);color:var(--pink);background-color:rgba(239,156,176,.09)}
.drop.hasBg{border-style:solid;border-color:var(--line)}
.drop.hasBg .ic{display:none}
.drop .ic{width:26px;height:26px}
.dropText{font-size:12px;text-align:center;padding:0 10px;line-height:1.5}
.imgHint{font-size:11px;color:var(--dim);text-align:center;line-height:1.6;letter-spacing:.05em}
.drop.over .dropText,.drop.hasBg .dropText{color:var(--pink)}

/* 倒计时 */
.cdInputs{display:flex;justify-content:center;gap:10px}
.cdInputs label{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11px;letter-spacing:.15em;color:var(--dim);
}
.cdInputs input[type=number]{
  width:64px;padding:11px 0;text-align:center;
  background:#FFFDF9;border:1px solid var(--line);border-radius:10px;
  font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;
  appearance:textfield;-moz-appearance:textfield;
}
.cdInputs input[type=number]::-webkit-outer-spin-button,
.cdInputs input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cdInputs input:focus{outline:none;border-color:var(--pink)}
.cdLabel{
  font-size:11px;letter-spacing:.24em;text-indent:.24em;color:var(--dim);
  text-align:center;margin-bottom:12px;
}
.cdRemain{
  font-family:var(--serif);font-size:36px;font-weight:700;
  text-align:center;font-variant-numeric:tabular-nums;margin-bottom:16px;
}

/* 闹钟 */
.timeRow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
input[type=time]{
  background:#FFFDF9;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:16px;color:var(--ink);
}
input[type=time]:focus{outline:none;border-color:var(--pink)}
.alTime{
  font-family:var(--serif);font-size:38px;font-weight:700;
  text-align:center;font-variant-numeric:tabular-nums;margin-bottom:16px;
}

/* ===== SECTION: pulse 明暗呼吸 ===== */
#pulse{position:fixed;inset:0;z-index:25;background:#221E1C;opacity:0;pointer-events:none}
body.pulsing #pulse{pointer-events:auto;animation:flash 2.6s ease-in-out infinite}
body.pulsing #stage{animation:breathe 2.6s ease-in-out infinite}
body.pulsing #dock,body.pulsing #panel{opacity:0;pointer-events:none}
@keyframes breathe{0%,100%{filter:brightness(1)}50%{filter:brightness(.82)}}
@keyframes flash{0%,100%{opacity:0}50%{opacity:.40}}

/* ===== SECTION: closeBtn 关闭按钮 ===== */
#closeBtn{
  position:fixed;left:50%;bottom:30vh;z-index:30;transform:translateX(-50%);
  min-height:52px;padding:0 40px;border-radius:999px;
  background:var(--pink);color:#2B1A20;
  font-size:15px;font-weight:700;letter-spacing:.14em;text-indent:.14em;
  box-shadow:0 14px 34px rgba(75,59,58,.2);
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;
}
body.pulsing #closeBtn{opacity:1;pointer-events:auto;animation:pop .4s cubic-bezier(.22,1,.36,1) both}
#closeBtn:hover{background:var(--pink-deep);color:#FFF8F2}
@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.9)}}

/* ===== SECTION: toast 轻提示 ===== */
#toast{
  position:fixed;top:24px;left:50%;z-index:40;
  transform:translateX(-50%) translateY(-8px);
  padding:10px 18px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  font-size:13px;color:var(--ink);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== SECTION: watermark 角标 ===== */
#mark{
  position:fixed;right:20px;bottom:18px;z-index:2;
  font-size:10.5px;letter-spacing:.3em;color:rgba(75,59,58,.24);pointer-events:none;
}

/* ===== SECTION: responsive 响应式 ===== */
@media (max-width:480px){
  #dock{bottom:24px}
  #panel{bottom:104px;padding:18px}
  #backHome{left:12px;top:12px;padding:7px 12px}
  #clock .hm{font-size:clamp(84px,24vw,300px)}
  #mark{display:none}
}
@media (prefers-reduced-motion:reduce){
  #clock{animation:none}
  body.pulsing #stage{animation:breathe 9s ease-in-out infinite}
  body.pulsing #pulse{animation:flash 9s ease-in-out infinite}
}
</style>
</head>
<body>

<!-- ===== SECTION: stage ===== -->
<div id="stage">
  <div id="bg"></div>
  <div id="bgShade"></div>
  <main id="clockWrap">
    <div id="modeTag"></div>
    <div id="clock"><span class="hm">00:00</span><span class="ss">00</span></div>
  </main>
</div>

<a id="backHome" href="index.html">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H6M11 6l-6 6 6 6"/></svg>
  回到小窝
</a>

<!-- ===== SECTION: panel ===== -->
<div id="panel"></div>

<!-- ===== SECTION: dock ===== -->
<nav id="dock" aria-label="静室功能">
  <button class="dockBtn" id="btnImg" aria-label="设置背景图片">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15.5l-4.5-4.5L7 20.5"/></svg>
    <span class="lbl">图片</span>
  </button>
  <button class="dockBtn" id="btnCd" aria-label="倒计时">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10M7 21h10M8 3c0 4.2 2.6 6.4 4 8.5 1.4-2.1 4-4.3 4-8.5M8 21c0-4.2 2.6-6.4 4-8.5 1.4 2.1 4 4.3 4 8.5"/></svg>
    <span class="lbl">倒计时</span>
  </button>
  <button class="dockBtn" id="btnAl" aria-label="闹钟">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
    <span class="lbl">闹钟</span>
  </button>
</nav>

<!-- ===== SECTION: pulse & close ===== -->
<div id="pulse"></div>
<button id="closeBtn">关 闭</button>
<div id="toast" role="status"></div>
<div id="mark">THREE'S 小窝 · 静室</div>
<input id="fileInput" type="file" accept="image/*" hidden>

<script>
(function(){
"use strict";

var $ = function(s){ return document.querySelector(s); };
var pad = function(n){ return String(n).padStart(2, "0"); };
var KEY = "three_clock_v1";

var state = {
  dockOpen: false,
  module: null,          /* 'image' | 'countdown' | 'alarm' */
  bg: null,
  cd: { running:false, end:0, h:0, m:0, s:0 },
  alarm: null,           /* 'HH:MM' */
  alarmFired: false,
  pulsing: false
};

var stage = $("#stage"), dock = $("#dock"), panel = $("#panel"),
    clockEl = $("#clock"), tagEl = $("#modeTag"), bgEl = $("#bg"),
    closeBtn = $("#closeBtn"), toastEl = $("#toast"), fileInput = $("#fileInput");

/* ---------- 存储 ---------- */
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({ bg: state.bg, alarm: state.alarm })); }catch(e){}
}
function load(){
  try{
    var d = JSON.parse(localStorage.getItem(KEY) || "null");
    if(!d) return;
    if(d.bg){ state.bg = d.bg; applyBg(d.bg); }
    if(d.alarm){ state.alarm = d.alarm; setTag("闹钟 " + d.alarm, true); }
  }catch(e){}
}
function applyBg(url){
  if(url){
    bgEl.style.backgroundImage = 'url("' + url + '")';
    document.body.classList.add("hasBg");
  }else{
    bgEl.style.backgroundImage = "";
    document.body.classList.remove("hasBg");
  }
}

/* ---------- 轻提示 ---------- */
var toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
}

/* ---------- 状态标签 ---------- */
function setTag(text, accent){
  if(!text){ tagEl.textContent = ""; tagEl.classList.remove("accent"); return; }
  tagEl.textContent = text;
  tagEl.classList.toggle("accent", !!accent);
}

/* ---------- 时间与判定 ---------- */
function remainText(){
  var t = Math.max(0, Math.ceil((state.cd.end - Date.now()) / 1000));
  var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
}

function trigger(type){
  if(state.pulsing) return;
  state.pulsing = true;
  state.cd.running = false;
  document.body.classList.add("pulsing");
  setTag(type === "countdown" ? "倒计时结束" : "闹钟时间到", true);
  if(type === "alarm"){ state.alarm = null; state.alarmFired = false; save(); }
}

function renderClock(){
  if(state.pulsing) return;
  if(state.cd.running){
    var ms = state.cd.end - Date.now();
    if(ms <= 0){ clockEl.textContent = "00:00"; trigger("countdown"); return; }
    var t = Math.ceil(ms / 1000);
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    clockEl.classList.add("cd");
    clockEl.textContent = h > 0 ? h + ":" + pad(m) + ":" + pad(s) : pad(m) + ":" + pad(s);
    return;
  }
  clockEl.classList.remove("cd");
  var n = new Date();
  if(state.alarm && !state.alarmFired){
    if(pad(n.getHours()) + ":" + pad(n.getMinutes()) === state.alarm){ trigger("alarm"); return; }
  }
  clockEl.innerHTML = '<span class="hm">' + pad(n.getHours()) + ":" + pad(n.getMinutes()) +
                      '</span><span class="ss">' + pad(n.getSeconds()) + "</span>";
}

/* ---------- 面板模板 ---------- */
function moduleTpl(){
  if(state.module === "image"){
    return '<div class="cdLabel">背景图</div>' +
      '<div class="imgWrap">' +
      '<div id="drop" class="drop' + (state.bg ? " hasBg" : "") + '" role="button" tabindex="0" aria-label="选择或拖入背景图片">' +
        '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15.5l-4.5-4.5L7 20.5"/></svg>' +
        '<span class="dropText">' + (state.bg ? "更换图片" : "拖入图片 / 点此选择") + "</span>" +
      "</div>" +
      (state.bg ? '<button class="btn" data-act="clearBg">移除背景</button>' : "") +
      '<div class="imgHint">电脑可拖拽 · 手机点此进相册</div>' +
    "</div>";
  }
  if(state.module === "countdown"){
    if(state.cd.running){
      return '<div class="cdLabel">剩余时间</div>' +
        '<div class="cdRemain" id="cdRemain">' + remainText() + "</div>" +
        '<button class="btn primary block" data-act="cdStop">停止倒计时</button>';
    }
    return '<div class="cdInputs">' +
        '<label>时<input id="cdH" type="number" min="0" max="99" inputmode="numeric" value="' + state.cd.h + '"></label>' +
        '<label>分<input id="cdM" type="number" min="0" max="59" inputmode="numeric" value="' + state.cd.m + '"></label>' +
        '<label>秒<input id="cdS" type="number" min="0" max="59" inputmode="numeric" value="' + state.cd.s + '"></label>' +
      "</div>" +
      '<button class="btn primary block" data-act="cdStart">开始倒计时</button>';
  }
  if(state.module === "alarm"){
    if(state.alarm){
      return '<div class="cdLabel">闹钟已设</div>' +
        '<div class="alTime">' + state.alarm + "</div>" +
        '<button class="btn primary block" data-act="alClear">取消闹钟</button>';
    }
    return '<div class="timeRow"><span>闹钟时间</span><input id="alTime" type="time"></div>' +
      '<button class="btn primary block" data-act="alSet">开启闹钟</button>';
  }
  return "";
}

function syncDock(){
  $("#btnImg").classList.toggle("on", state.module === "image");
  $("#btnCd").classList.toggle("on", state.module === "countdown");
  $("#btnAl").classList.toggle("on", state.module === "alarm");
}

function renderPanel(){
  panel.innerHTML = moduleTpl();
  syncDock();
  panel.classList.toggle("show", !!state.module);
  document.body.classList.toggle("panel-open", !!state.module);
  bindPanel();
}

/* ---------- 面板动作 ---------- */
var acts = {
  clearBg: function(){
    state.bg = null; applyBg(null); save(); renderPanel(); toast("背景已移除");
  },
  cdStart: function(){
    var h = +(document.getElementById("cdH").value || 0);
    var m = +(document.getElementById("cdM").value || 0);
    var s = +(document.getElementById("cdS").value || 0);
    var total = (h * 3600 + m * 60 + s) * 1000;
    if(total <= 0){ toast("请先设置倒计时时长"); return; }
    state.cd = { running:true, end:Date.now() + total, h:h, m:m, s:s };
    setTag("倒计时中", true);
    renderPanel();
  },
  cdStop: function(){
    state.cd.running = false; setTag(""); renderPanel();
  },
  alSet: function(){
    var v = document.getElementById("alTime").value;
    if(!v){ toast("请选择闹钟时间"); return; }
    state.alarm = v; state.alarmFired = false; save();
    setTag("闹钟 " + v, true); renderPanel();
  },
  alClear: function(){
    state.alarm = null; state.alarmFired = false; save();
    setTag(""); renderPanel();
  }
};

function handleFile(f){
  if(!f || f.type.indexOf("image/") !== 0){ toast("请选择图片文件"); return; }
  var r = new FileReader();
  r.onload = function(e){
    var url = e.target.result;
    state.bg = url; applyBg(url);
    var saved = true;
    try{ save(); }catch(err){ saved = false; }
    if(state.module === "image") renderPanel();
    toast(saved ? "背景已更新" : "图片较大，仅本次会话生效");
  };
  r.readAsDataURL(f);
}

function bindPanel(){
  var box = document.getElementById("drop");
  if(!box) return;
  box.addEventListener("click", function(){ fileInput.click(); });
  box.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fileInput.click(); }
  });
  box.addEventListener("dragover", function(e){ e.preventDefault(); box.classList.add("over"); });
  box.addEventListener("dragleave", function(){ box.classList.remove("over"); });
  box.addEventListener("drop", function(e){
    e.preventDefault();
    box.classList.remove("over");
    var f = e.dataTransfer.files[0];
    if(f) handleFile(f);
  });
  if(state.bg) box.style.backgroundImage = 'url("' + state.bg + '")';
}

/* ---------- 打开 / 切换模块 ---------- */
function openModule(name, force){
  state.module = (state.module === name && !force) ? null : name;
  state.dockOpen = true;
  dock.classList.add("show");
  renderPanel();
}

/* ---------- 事件 ---------- */
stage.addEventListener("click", function(){
  if(state.pulsing) return;
  state.dockOpen = !state.dockOpen;
  dock.classList.toggle("show", state.dockOpen);
  if(!state.dockOpen){ state.module = null; renderPanel(); }
});
dock.addEventListener("click", function(e){ e.stopPropagation(); });
panel.addEventListener("click", function(e){
  e.stopPropagation();
  var b = e.target.closest("[data-act]");
  if(b && acts[b.dataset.act]) acts[b.dataset.act]();
});
$("#btnImg").addEventListener("click", function(){ openModule("image"); });
$("#btnCd").addEventListener("click", function(){ openModule("countdown"); });
$("#btnAl").addEventListener("click", function(){ openModule("alarm"); });
$("#backHome").addEventListener("click", function(e){ e.stopPropagation(); });

fileInput.addEventListener("change", function(){
  if(fileInput.files[0]) handleFile(fileInput.files[0]);
  fileInput.value = "";
});

closeBtn.addEventListener("click", function(){
  state.pulsing = false;
  document.body.classList.remove("pulsing");
  setTag("");
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(state.pulsing){ closeBtn.click(); }
    else{
      state.module = null; state.dockOpen = false;
      dock.classList.remove("show"); renderPanel();
    }
  }
});

/* 拖文件到窗口任意处 → 自动唤出图片面板 */
window.addEventListener("dragenter", function(e){
  if(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, "Files") !== -1){
    openModule("image", true);
  }
});
window.addEventListener("dragover", function(e){ e.preventDefault(); });
window.addEventListener("drop", function(e){ e.preventDefault(); });

/* ---------- 启动 ---------- */
load();
renderClock();
setInterval(renderClock, 250);
setInterval(function(){
  if(state.cd.running && state.module === "countdown"){
    var el = document.getElementById("cdRemain");
    if(el) el.textContent = remainText();
  }
}, 250);
})();
</script>
</body>
</html>
