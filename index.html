<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three 的小窝</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='4' width='16' height='16' rx='4' fill='%23EF9CB0'/%3E%3Cpath d='M5 11 12 6l7 5' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='10' y='12' width='4' height='5' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ===== 基础 ===== */
:root{
  --bg:#FDF8F1;
  --bg-soft:#F8EFE4;
  --ink:#4B3B3A;
  --ink-soft:#7A6A66;
  --pink:#EF9CB0;
  --pink-deep:#E0789A;
  --blue:#7FA8D9;
  --yellow:#F4C76B;
  --card:#FFFFFF;
  --line:#EFE2D4;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
a,button,.cast,.g-item,.anime-tile{outline:none}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);
  line-height:1.75;font-size:15px;
}
.serif{font-family:"Noto Serif SC",Georgia,"Songti SC",serif}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

/* ===== 顶部导航 ===== */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(253,248,241,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px}
.brand .logo{width:30px;height:30px;flex:none}
.brand .logo .pin{fill:var(--pink-deep)}
.nav-links{display:flex;gap:22px;font-size:14px;font-weight:500;color:var(--ink-soft)}
.nav-links a:hover{color:var(--pink-deep)}

/* ===== Hero ===== */
.hero{
  position:relative;min-height:78vh;display:flex;align-items:center;
  overflow:hidden;color:#fff;
}
.hero-bg-track{
  position:absolute;inset:0;display:flex;align-items:center;
  width:210vw;animation:hero-scroll 48s linear infinite;
  will-change:transform;
}
.hero-panel{
  flex:none;overflow:hidden;margin-right:-2vw;
  box-shadow:0 16px 34px rgba(0,0,0,.32);
  outline:1px solid rgba(255,255,255,.14);
}
.hero-panel img{
  display:block;width:100%;height:100%;object-fit:cover;
  filter:saturate(1.06);
}
.hero-panel.hp1{width:20vw;height:80%;align-self:flex-start;transform:rotate(-2.5deg)}
.hero-panel.hp2{width:24vw;height:66%;align-self:flex-end;transform:rotate(2deg)}
.hero-panel.hp3{width:26vw;height:56%;align-self:center;transform:rotate(-1.5deg)}
.hero-panel.hp4{width:25vw;height:64%;align-self:flex-start;transform:rotate(1.5deg)}
.hero-panel.hp5{width:20vw;height:82%;align-self:flex-end;transform:rotate(-2deg)}
@keyframes hero-scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-105vw)}
}
@media (prefers-reduced-motion:reduce){
  .hero-bg-track{animation:none}
}
.hero h1 sup{
  font-size:.5em;vertical-align:super;letter-spacing:.04em;margin-left:.06em;
  text-shadow:0 3px 18px rgba(0,0,0,.35);
}
.hero::before{
  content:"";position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;
  background:linear-gradient(180deg,rgba(253,248,241,0) 0%,rgba(253,248,241,.72) 82%,var(--bg) 100%);
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(52,38,44,.62) 0%,rgba(52,38,44,.4) 30%,rgba(52,38,44,.16) 52%,rgba(52,38,44,.38) 78%,rgba(52,38,44,.62) 100%);
}
.hero .wrap{position:relative;z-index:2;text-align:center}
.hero .kicker{
  display:inline-block;letter-spacing:.35em;font-size:13px;
  color:#FFE3EA;margin-bottom:16px;
}
.hero h1{
  font-family:"Noto Serif SC",serif;font-size:clamp(44px,8vw,84px);
  font-weight:900;line-height:1.15;letter-spacing:.08em;
  text-shadow:0 3px 18px rgba(0,0,0,.35);
}
.hero .sub{
  margin:18px auto 0;max-width:560px;font-size:15px;color:#FFF3F5;
  text-shadow:0 1px 8px rgba(0,0,0,.4);
}
.hero .scroll-hint{
  margin-top:34px;font-size:13px;letter-spacing:.2em;color:#FFDDE4;opacity:.9;
}
.hero .scroll-hint svg{display:inline-block;vertical-align:-2px;margin-left:6px;animation:bounce 1.8s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ===== 章节通用 ===== */
section{padding:72px 0}
.section-head{margin-bottom:34px;max-width:760px}
.section-head .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;letter-spacing:.25em;color:var(--pink-deep);font-weight:700;
}
.section-head .eyebrow::before{content:"";width:26px;height:2px;background:var(--pink);border-radius:2px}
.section-head h2{
  font-family:"Noto Serif SC",serif;font-size:clamp(26px,3.6vw,36px);
  font-weight:900;margin:10px 0 8px;
}
.section-head p{color:var(--ink-soft);font-size:14.5px}

/* ===== 追番记录 ===== */
.records{background:var(--bg-soft)}
.anime-card{
  display:grid;grid-template-columns:340px 1fr;gap:28px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:0 8px 26px rgba(120,90,70,.08);
}
.anime-card .cover{position:relative;aspect-ratio:4/3;overflow:hidden}
.anime-card .cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.anime-card:hover .cover img{transform:scale(1.04)}
.anime-card .cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(40,28,30,.32),transparent 42%);
}
.status-badge{
  position:absolute;left:16px;bottom:14px;z-index:2;
  background:var(--pink);color:#fff;font-size:12.5px;font-weight:700;
  padding:4px 14px;border-radius:999px;letter-spacing:.08em;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}
.anime-info{padding:26px 30px 28px 0}
.anime-info .title-line{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.anime-info h3{
  font-family:"Noto Serif SC",serif;font-size:27px;font-weight:900;
}
.anime-info .jp{color:var(--ink-soft);font-size:13px;letter-spacing:.06em}
.meta-line{
  display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 14px;
}
.chip{
  font-size:12.5px;color:#5E504B;background:var(--bg-soft);
  border:1px solid var(--line);border-radius:8px;padding:3px 11px;
}
.chip b{color:var(--pink-deep);font-weight:700}
.anime-info .desc{color:#5A4C48;font-size:14.5px;margin-bottom:12px}
.note{
  border-left:3px solid var(--pink);background:#FDF3F5;
  padding:10px 16px;border-radius:0 10px 10px 0;font-size:13.5px;color:#6B4A52;
}
.note .who{font-weight:700;color:var(--pink-deep)}

/* ===== 成员 ===== */
.cast-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:6px;
}
.cast-grid.cg6{grid-template-columns:repeat(3,1fr)}
.cast{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 14px 18px;text-align:center;transition:transform .25s ease, box-shadow .25s ease;
}
.cast:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(120,90,70,.12)}
.cast .role-icon{
  width:64px;height:64px;margin:0 auto 12px;border-radius:50%;
  background:var(--card);display:flex;align-items:center;justify-content:center;
  overflow:hidden;border:2px solid var(--pink);
  box-shadow:0 4px 12px rgba(224,120,154,.28);
}
.cast .role-icon img{width:100%;height:100%;object-fit:cover}
.cast h4{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:900}
.cast .romaji{font-size:12px;color:var(--ink-soft);margin:2px 0 8px;letter-spacing:.05em}
.cast .duty{font-size:12.5px;font-weight:700;color:var(--pink-deep);margin-bottom:6px}
.cast p{font-size:12.5px;color:var(--ink-soft);line-height:1.6}

/* ===== 画廊 ===== */
.gallery-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
}
.g-item{
  position:relative;border-radius:14px;overflow:hidden;cursor:zoom-in;
  border:1px solid var(--line);background:var(--card);aspect-ratio:4/3;
}
.g-item img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.g-item:hover img{transform:scale(1.05)}
.g-item figcaption{
  position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;
  background:linear-gradient(0deg,rgba(40,28,30,.55),transparent);
  color:#fff;font-size:12.5px;text-align:left;opacity:0;transition:opacity .3s ease;
}
.g-item:hover figcaption{opacity:1}

/* ===== Lightbox ===== */
.lightbox{
  position:fixed;inset:0;z-index:100;
  background:rgba(20,14,16,0);
  display:flex;align-items:center;justify-content:center;padding:40px;
  visibility:hidden;opacity:0;
  transition:opacity .32s ease, visibility .32s, background .32s ease;
}
.lightbox.open{visibility:visible;opacity:1;background:rgba(20,14,16,.94)}
.lightbox img{
  max-width:92vw;max-height:84vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  transform:scale(.08);opacity:0;
  transition:transform .36s cubic-bezier(.3,.75,.2,1), opacity .28s ease;
}
.lightbox.open img{transform:scale(1);opacity:1}
.lb-caption{
  position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#EAD9DD;font-size:13px;letter-spacing:.04em;
  opacity:0;transition:opacity .3s ease .14s;
}
.lightbox.open .lb-caption{opacity:1}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.08);border:none;color:#fff;cursor:pointer;
  width:48px;height:48px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;
  transition:background .2s ease, opacity .3s ease .14s;opacity:0;
}
.lightbox.open .lb-nav{opacity:1}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-prev{left:20px}.lb-next{right:20px}

/* ===== 角色详情弹窗 ===== */
.cast{cursor:pointer}
.cast .open-hint{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:14px;background:var(--pink);color:#fff;
  font-size:13px;font-weight:700;letter-spacing:.06em;
  padding:8px 18px;border-radius:999px;
  box-shadow:0 8px 18px rgba(244,114,146,.32);
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
}
.cast:hover .open-hint{transform:translateY(-2px);box-shadow:0 12px 24px rgba(244,114,146,.45);background:#E0688C}
.cast .open-hint::after{content:"→";margin-left:3px}

/* ===== 点选引导：列表可点 + 角色可点 ===== */
.tap-hint{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:max-content;max-width:100%;margin:0 auto 30px;
  background:var(--pink);color:#fff;
  padding:11px 24px;border-radius:999px;
  font-size:14.5px;font-weight:700;letter-spacing:.05em;
  box-shadow:0 12px 26px rgba(244,114,146,.38);
  animation:hint-bob 2.4s ease-in-out infinite;
}
.tap-hint svg{flex:none;animation:hint-wave 2.4s ease-in-out infinite}
@keyframes hint-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes hint-wave{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.anime-tile::after{
  content:"点我进入 →";
  position:absolute;left:50%;top:50%;z-index:3;
  transform:translate(-50%,-50%) scale(.82);
  background:rgba(255,255,255,.94);color:#C0506E;
  font-size:13.5px;font-weight:800;letter-spacing:.05em;
  padding:9px 20px;border-radius:999px;
  box-shadow:0 10px 24px rgba(0,0,0,.28);
  opacity:0;transition:opacity .28s ease, transform .28s ease;
  pointer-events:none;
}
.anime-tile:hover::after{opacity:1;transform:translate(-50%,-50%) scale(1)}
.char-modal{
  position:fixed;inset:0;z-index:110;
  background:rgba(20,14,16,0);
  display:flex;align-items:center;justify-content:center;padding:24px;
  visibility:hidden;opacity:0;
  transition:opacity .32s ease, visibility .32s, background .32s ease;
}
.char-modal.open{visibility:visible;opacity:1;background:rgba(20,14,16,.9)}
.char-modal .sheet{
  background:var(--bg);border-radius:20px;max-width:880px;width:100%;
  max-height:86vh;overflow:auto;display:grid;grid-template-columns:300px 1fr;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  transform:scale(.1);opacity:0;
  transition:transform .36s cubic-bezier(.3,.75,.2,1), opacity .28s ease;
}
.char-modal.open .sheet{transform:scale(1);opacity:1}
.char-modal .cimg{position:relative;overflow:hidden;min-height:440px}
.char-modal .cimg img{width:100%;height:100%;object-fit:cover}
.char-modal .cinfo{padding:28px 30px 30px}
.char-modal .cname{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.char-modal .cname h3{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900}
.char-modal .cname .cjp{color:var(--ink-soft);font-size:13px;letter-spacing:.06em}
.char-modal .ctags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
.citems{list-style:none}
.citems li{
  display:flex;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);
  font-size:14px;line-height:1.7;
}
.citems li:last-child{border-bottom:none}
.citems .k{flex:none;width:64px;color:var(--pink-deep);font-weight:700;font-size:13.5px}
.citems .v{color:#574A46}

/* ===== 返回顶部 ===== */
.back-top{
  position:fixed;right:22px;bottom:26px;z-index:60;
  width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
  background:var(--pink);color:#fff;box-shadow:0 8px 22px rgba(224,120,154,.4);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .3s ease, transform .3s ease, visibility .3s;
}
.back-top.show{opacity:1;visibility:visible;transform:translateY(0)}
.back-top:hover{background:var(--pink-deep)}

/* ===== 番列表（一级页） ===== */
.anime-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;
}
.anime-tile{
  position:relative;display:block;border-radius:16px;overflow:hidden;
  aspect-ratio:4/3;border:1px solid var(--line);background:var(--card);
  box-shadow:0 6px 18px rgba(120,90,70,.1);
  transition:transform .3s ease, box-shadow .3s ease;
}
.anime-tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(120,90,70,.18)}
.anime-tile img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .4s ease;
}
.anime-tile:hover img{transform:scale(1.06)}
.anime-tile .tile-mask{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(40,28,30,0) 38%,rgba(40,28,30,.62) 100%);
}
.anime-tile .tile-text{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 14px;color:#fff}
.anime-tile .tile-text h3{
  font-family:"Noto Serif SC",serif;font-size:21px;font-weight:900;
  text-shadow:0 2px 10px rgba(0,0,0,.55);
}
.anime-tile .tile-text .tjp{
  font-size:12px;color:rgba(255,255,255,.88);margin:3px 0 9px;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
.anime-tile .tile-status{
  display:inline-block;background:var(--pink);color:#fff;font-size:11.5px;font-weight:700;
  padding:2px 10px;border-radius:999px;letter-spacing:.06em;
}
.anime-tile.placeholder{
  display:flex;align-items:center;justify-content:center;
  background:var(--bg-soft);border-style:dashed;border-color:#DCCDBE;
  color:var(--ink-soft);font-size:14px;letter-spacing:.15em;
  box-shadow:none;
}

/* ===== 二级页视图 ===== */

}

/* 图片收藏区顶部用渐变过渡：从暗色底图虚化渐变到浅色图集区，边界不突兀 */
.view-anime .gallery-sec{background:linear-gradient(180deg,rgba(248,239,228,0) 0%,rgba(248,239,228,.95) 150px)}
.view-anime .gallery-sec .section-head h2{color:var(--ink)}

.backbar{
  position:sticky;top:60px;z-index:40;
  background:rgba(253,248,241,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.backbar .wrap{display:flex;align-items:center;gap:12px;height:52px}
.backbar a{
  display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pink-deep);
  font-size:14px;border:1.5px solid var(--pink);background:#fff;border-radius:999px;
  padding:5px 14px;box-shadow:0 2px 8px rgba(224,120,154,.18);
  transition:background .2s ease, color .2s ease, box-shadow .2s ease;
}

/* ===== 视图过渡动画 ===== */
.vt-overlay{
  position:fixed;z-index:90;overflow:hidden;border-radius:16px;background:#2E2326;
  transition:left .54s cubic-bezier(.3,.75,.2,1), top .54s cubic-bezier(.3,.75,.2,1),
    width .54s cubic-bezier(.3,.75,.2,1), height .54s cubic-bezier(.3,.75,.2,1),
    border-radius .54s cubic-bezier(.3,.75,.2,1), opacity .4s ease;
  will-change:left,top,width,height;
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}
.vt-overlay img{width:100%;height:100%;object-fit:cover;opacity:.5}
.vt-overlay.vt-expand{left:0 !important;top:0 !important;width:100vw !important;height:100vh !important;border-radius:0}
.vt-mask{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(40,28,30,.08) 0%,rgba(40,28,30,.55) 100%);
}
.vt-title{
  position:absolute;left:0;right:0;top:20px;text-align:center;color:#fff;
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(24px,4vw,34px);
  letter-spacing:.08em;text-shadow:0 2px 14px rgba(0,0,0,.55);
  opacity:0;transform:translateY(14px);
  transition:opacity .4s ease .18s, transform .4s ease .18s;
}
.vt-title-show{opacity:1;transform:translateY(0)}
.vt-overlay.vt-fade{opacity:0}
